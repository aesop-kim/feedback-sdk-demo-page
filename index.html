    <script type="module" crossorigin src="./assets/index-CD78DD9U.js"></script>

  <body>
    <div id="root"></div>

    <!-- 주소 뒤의 ?sdk= 값으로 팀 SDK 스크립트를 불러옵니다. 예: ?sdk=https://팀이름.vercel.app/sdk.js -->
    <script>
      (function () {
        var sdkUrl = new URLSearchParams(location.search).get('sdk');
        if (!sdkUrl) return;
        if (!/^https:\/\//.test(sdkUrl) && !/^http:\/\/localhost[:/]/.test(sdkUrl)) return;
        var script = document.createElement('script');
        script.src = sdkUrl;
        document.body.appendChild(script);
      })();
    </script>
  </body>
